# Continuous integration for the Masaar ERP backend.
#
# This repository ran a full suite that nothing executed automatically. It was
# green whenever someone remembered to check, which is not the same as being
# green — a refactor could land red and stay red until the next person looked.
# The count is deliberately not written here; `php artisan test` reports it, and
# a number in a comment is wrong the week after it is written.
#
# PHP 8.4 everywhere: this workflow, the "php" constraint in composer.json, the
# compliance platform this ERP talks to, and what developers run locally. Keep
# them in step.
#
# 8.2 was the declared floor while the lock file had already moved past it —
# jwt-auth and pint both require ^8.3 — so composer install failed here on a
# lock that installs fine on a developer's machine. A constraint no environment
# actually runs is not a compatibility promise, it is an untested claim.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    # composer install runs artisan package:discover, which boots the
    # application before .env exists. config/cache.php falls back to redis
    # and config/telescope.php to enabled, so discovery registered
    # Telescope, which touched the cache, which asked for a Redis class no
    # runner has. composer install failed, and the job reported an exit
    # code with nothing about a test in it. These match what phpunit.xml
    # already uses.
    env:
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TELESCOPE_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # sqlite3/pdo_sqlite back the in-memory test database declared in
          # phpunit.xml; bcmath is required for monetary arithmetic.
          extensions: mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # .env.example ships an empty JWT_SECRET and nothing filled it,
          # so every authenticated test failed with "Key cannot be empty".
          php artisan jwt:secret --force

      - name: Run test suite
        run: php artisan test --log-junit junit.xml

      # A failing suite shows in the Actions UI as an exit code and nothing
      # else. This puts the failing tests on the run page. If it reports no
      # JUnit file, the run broke before the suite started.
      - name: Summarise the suite
        if: always()
        run: php .github/junit-summary.php junit.xml Tests

  # The suite runs on SQLite for speed, and the application runs on MySQL.
  # Until this job existed, nothing had ever run the migrations against MySQL
  # and they did not work: an index name over the 64-character limit stopped
  # the schema being built at all, invoices declared the same foreign key three
  # times, and every encrypted column was sized for its plaintext.
  #
  # Worse than the schema, SQLite reads an unknown double-quoted identifier as
  # a string literal rather than failing, so a query filtering on a column that
  # does not exist matches no rows instead of raising. Twenty-three endpoints
  # answered 200 with nothing in them on SQLite and 500 on MySQL. A green
  # SQLite run does not mean the query is valid; this job is what says that.
  mysql:
    name: Tests on MySQL
    runs-on: ubuntu-latest

    # composer install runs artisan package:discover, which boots the
    # application before .env exists. config/cache.php falls back to redis
    # and config/telescope.php to enabled, so discovery registered
    # Telescope, which touched the cache, which asked for a Redis class no
    # runner has. composer install failed, and the job reported an exit
    # code with nothing about a test in it. These match what phpunit.xml
    # already uses.
    env:
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TELESCOPE_ENABLED: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: masaar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # .env.example ships an empty JWT_SECRET and nothing filled it,
          # so every authenticated test failed with "Key cannot be empty".
          php artisan jwt:secret --force

      # phpunit.xml declares sqlite, and PHPUnit leaves an <env> alone when the
      # variable is already set, so these win without editing the file.
      - name: Run test suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: masaar_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test --log-junit junit.xml

      - name: Summarise the suite
        if: always()
        run: php .github/junit-summary.php junit.xml "Tests on MySQL"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # Its own job so an advisory published against a pinned package surfaces
      # here rather than hiding behind a passing suite.
      - name: Audit dependencies
        run: composer audit --locked
