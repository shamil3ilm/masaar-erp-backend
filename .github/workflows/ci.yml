# Continuous integration for the Masaar ERP backend.
#
# This repository ran a full suite that nothing executed automatically. It was
# green whenever someone remembered to check, which is not the same as being
# green — a refactor could land red and stay red until the next person looked.
# The count is deliberately not written here; `php artisan test` reports it, and
# a number in a comment is wrong the week after it is written.
#
# PHP 8.2 matches the "php" constraint in composer.json. Keep the two in step:
# the compliance platform this ERP talks to requires 8.4, and the version drift
# between them is deliberate, not an oversight.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # sqlite3/pdo_sqlite back the in-memory test database declared in
          # phpunit.xml; bcmath is required for monetary arithmetic.
          extensions: mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # Its own job so an advisory published against a pinned package surfaces
      # here rather than hiding behind a passing suite.
      - name: Audit dependencies
        run: composer audit --locked
